databaseChangeLog:
  - changeSet:
      id: 002-create-outbox-event
      author: you
      changes:
        - createTable:
            tableName: outbox_event
            columns:

              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: aggregate_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: event_type
                  type: VARCHAR(100)
                  constraints:
                    nullable: false

              - column:
                  name: payload
                  type: TEXT
                  constraints:
                    nullable: false

              - column:
                  name: status
                  type: VARCHAR(50)
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false

              - column:
                  name: processed_at
                  type: TIMESTAMP

        - createIndex:
            indexName: idx_outbox_status_created_at
            tableName: outbox_event
            columns:
              - column:
                  name: status
              - column:
                  name: created_at